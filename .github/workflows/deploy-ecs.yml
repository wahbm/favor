name: Validate and deploy ECS
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: favor-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: local-ci-only
          MARIADB_DATABASE: favor_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_BASE_PATH: /mosshqq/favor/
      - run: npm test
        env:
          TEST_DATABASE_URL: mysql://root:local-ci-only@127.0.0.1:3306/favor_test
      - run: npm prune --omit=dev
      - run: |
          tar -czf favor-linux-x64.tgz dist node_modules package.json package-lock.json deploy/smoke-production.mjs
          sha256sum favor-linux-x64.tgz > favor-linux-x64.tgz.sha256
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: favor-linux-x64
          path: |
            favor-linux-x64.tgz
            favor-linux-x64.tgz.sha256
          retention-days: 7
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: favor-linux-x64
      - name: Validate artifact and configure strict SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          sha256sum --check favor-linux-x64.tgz.sha256
          test -n "$SSH_PRIVATE_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          [[ "$DEPLOY_HOST" == '8.130.116.192' && "$DEPLOY_USER" == 'deploy' && "$DEPLOY_PORT" == '22' ]]
          [[ "$DEPLOY_PATH" == '/var/www/mosshqq/favor' ]]
          install -d -m 700 "$RUNNER_TEMP/favor-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/favor-ssh/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/favor-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/favor-ssh/key" "$RUNNER_TEMP/favor-ssh/known_hosts"
          printf 'RELEASE_ID=%s-%s-%s\n' "${GITHUB_SHA:0:12}" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Upload immutable release and activate
        run: |
          set -euo pipefail
          ssh_options=(-i "$RUNNER_TEMP/favor-ssh/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/favor-ssh/known_hosts")
          ssh "${ssh_options[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "test -d '$DEPLOY_PATH/incoming' && test ! -e '$DEPLOY_PATH/releases/$RELEASE_ID'"
          scp "${ssh_options[@]}" -P "$DEPLOY_PORT" favor-linux-x64.tgz "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/incoming/$RELEASE_ID.tgz"
          ssh "${ssh_options[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "set -eu; mkdir '$DEPLOY_PATH/releases/$RELEASE_ID'; tar -xzf '$DEPLOY_PATH/incoming/$RELEASE_ID.tgz' -C '$DEPLOY_PATH/releases/$RELEASE_ID'; sudo -n /usr/local/sbin/favor-release '$RELEASE_ID'; rm '$DEPLOY_PATH/incoming/$RELEASE_ID.tgz'"
      - name: Verify production login, persistence and export; clean acceptance data
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/favor-ssh/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/favor-ssh/known_hosts" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'sudo -n /usr/local/sbin/favor-release smoke'
      - name: Verify public HTTPS health and page
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 3 --max-time 20 https://8.130.116.192/mosshqq/favor/api/health | grep -F '"ok":true'
          curl --fail --show-error --silent --max-time 20 https://8.130.116.192/mosshqq/favor/ | grep -F '/mosshqq/favor/assets/'
      - name: Retain current and one known-good release
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/favor-ssh/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/favor-ssh/known_hosts" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'sudo -n /usr/local/sbin/favor-release prune'
      - name: Remove runner-only SSH files
        if: always()
        run: rm -f "$RUNNER_TEMP/favor-ssh/key" "$RUNNER_TEMP/favor-ssh/known_hosts"
